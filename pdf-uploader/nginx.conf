server {
    listen 80;
    server_name _;

    # Serve the React build
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container named "backend"
    location /professorAI/ {
        proxy_pass         http://backend:8000/professorAI/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # All other paths should serve index.html (for client-side routing)
    location / {
        try_files $uri /index.html;
    }
}